name: Meme trench feed
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "meme-token/site/**"
      - "meme-token/worker.js"
      - ".github/workflows/meme-token.yml"
permissions:
  contents: write
concurrency: meme-trench
defaults:
  run:
    working-directory: meme-token
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node whale-buys.js
      - run: node hl-snapshot.js
      - run: node quant-bot.js
        continue-on-error: true
      - name: Deploy website
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRET_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whale-state.json site/quant.json
          git diff --cached --quiet || (git commit -qm "meme state" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 3; done)
