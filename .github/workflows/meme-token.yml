name: Meme trench feed
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: meme-trench
defaults:
  run:
    working-directory: meme-token
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node whale-buys.js
      - name: Deploy website
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRET_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whale-state.json
          git diff --cached --quiet || (git commit -m "meme state" && git pull --rebase -q && git push)
