name: Paper bot
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: paper-bot
defaults:
  run:
    working-directory: paper-bot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/bot.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
