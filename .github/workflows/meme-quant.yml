name: Meme quant bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: meme-quant
  cancel-in-progress: false
defaults:
  run:
    working-directory: meme-token
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run paper bot
        run: node meme-quant-bot.js
        env:
          PUSH_RUN_KEY: ${{ secrets.PUSH_RUN_KEY }}
