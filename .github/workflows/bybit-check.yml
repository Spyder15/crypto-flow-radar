name: Bybit proxy deploy
on:
  push:
    paths:
      - ".github/workflows/bybit-check.yml"
      - "meme-token/bybit-proxy/**"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meme-token/bybit-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy proxy worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRET_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      - name: Test from this runner
        run: |
          sleep 10
          curl -s -D - "https://bybit-proxy.spyder-radar.workers.dev/v5/market/kline?category=linear&symbol=BTCUSDT&interval=60&limit=2" | grep -iE "^HTTP|cf-ray|retCode|error" | head -5
