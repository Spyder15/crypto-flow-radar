name: Refresh whale wallet list

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/whales-list.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet smc-screener/whales.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smc-screener/whales.json
          git commit -m "Refresh whale wallet list"
          git push
