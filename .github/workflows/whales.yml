name: Refresh whale wallet list

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bot/whales-list.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet smc-screener/whales.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smc-screener/whales.json
          git commit -m "Refresh whale wallet list"
          git push
      # Deploys the worker so the bot and site pick up the new list. Needs the CLOUDFLARE_API_TOKEN repo secret.
      - name: Deploy worker
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
