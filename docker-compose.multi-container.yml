services:
  postgresql:
    image: postgres:13
    container_name: hotel-orchestrator-postgresql
    network_mode: host
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      PGPORT: 5433
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hotel-orchestrator-temporal
    network_mode: host
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5433
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=127.0.0.1
      - TEMPORAL_ADDRESS=127.0.0.1:7233

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: hotel-orchestrator-temporal-ui
    network_mode: host
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=127.0.0.1:7233
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000

  redis:
    image: redis:7-alpine
    container_name: hotel-orchestrator-redis
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hotel-orchestrator-app
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - PORT=3000
      - REDIS_URL=redis://127.0.0.1:6379
      - TEMPORAL_ADDRESS=127.0.0.1:7233
      - TEMPORAL_TASK_QUEUE=hotel-offer-task-queue
      - SUPPLIER_BASE_URL=http://127.0.0.1:3000
    command: ["node", "dist/server.js"]

  worker:
    build: .
    container_name: hotel-orchestrator-worker
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      app:
        condition: service_started
    environment:
      - REDIS_URL=redis://127.0.0.1:6379
      - TEMPORAL_ADDRESS=127.0.0.1:7233
      - TEMPORAL_TASK_QUEUE=hotel-offer-task-queue
      - SUPPLIER_BASE_URL=http://127.0.0.1:3000
    command: ["node", "dist/temporal/worker.js"]

volumes:
  postgresql-data:
